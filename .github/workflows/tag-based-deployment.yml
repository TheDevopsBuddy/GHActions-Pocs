name: Tag Based Deployment

on:
  push:
    branches:    
  workflow_dispatch:
  create:
    tags:
      - '*'

jobs:
  TEST:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: TEST
        run: echo "This is test runs by default"
  STAGING:
    if: contains(github.ref, 'refs/tags/staging-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: STAGING Deployment
        run: echo This runs for STAGING for tag push ${{ github.ref }}"

  PROD:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: PROD Deployment
        run: echo "this runs for PROD for tag push ${{ github.ref }}"
