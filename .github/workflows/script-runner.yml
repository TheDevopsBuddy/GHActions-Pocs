name: Upload and Execute Script

on:
  push:
    branches:
      - script-runner

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Upload the script as an artifact
      - name: Upload Script as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-script
          path: scripts/run.sh

  download-and-execute:
    runs-on: ubuntu-latest
    needs: upload # Add dependency on the 'upload' job

    steps:
      # Step 3: Download the artifact in a new step
      - name: Download Script Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-script
          path: ./ # Downloads the artifact to the current directory

      # Step 4: Grant execute permission and run the script
      - name: Execute the Script
        run: ./run.sh

      # Step 5: Print the output of the script
      - name: Cat output
        run: cat date_time.txt
