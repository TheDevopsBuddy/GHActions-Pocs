name: Tag Deployment

on:
  push:
    tags:
      - 'v*'
      - 'staging*'

jobs:
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to production
        run: echo "Deploying to production..."

  deploy-uat:
    if: startsWith(github.ref, 'refs/tags/staging')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Print ref
        run: |
         echo "Ref: ${{ github.ref }}"
         if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Ref is main"
         else
            echo "Ref is not main"
         fi

      - name: Deploy to UAT
        run: echo "Deploying to UAT..."
