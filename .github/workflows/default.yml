name: Tag Deployment

on:
  push:
    tags:
      - 'v*'
      - 'staging*'

jobs:
  deploy-prod:
    if: "startsWith(github.ref, 'refs/tags/v') && github.ref == 'refs/heads/master'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Publish artifacts
        run: npm run publish

      - name: Deploy to production
        run: echo "Deploying to production..."

  deploy-uat:
    if: "startsWith(github.ref, 'refs/tags/staging') && github.ref == 'refs/heads/master'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Publish artifacts
        run: npm run publish

      - name: Deploy to UAT
        run: echo "Deploying to UAT..."
