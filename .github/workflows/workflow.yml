name: CICD

on:
 push:
 workflow_dispatch:

# permissions:
#   id-token: write
#   contents: write

jobs:
  CI:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Clone Target Repo #GHActions repo containing files to be edited
      uses: actions/checkout@v4
      with:
        repository: TheDevopsBuddy/GHActions-Pocs
        ref: 'main'
        #token: ${{ secrets.GITHUB_TOKEN }}
        #token: ${{ secrets.GH_PAT }}        
    - name: Dir Stat
      run: |
        ls
        pwd
        cd ./GHActions-Poc
        ls
        pwd
  CD:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Deploy svc/job
      uses: ./.github/workflows/deployer.yaml
      with:
        folder: JOB
        file: values-uat.yaml
        node: my-applicaton
