name: The Variable Parser
on:
  workflow_call:
    inputs:
      variable:
        description: 'variable to parse'
        default: 'Default'
        required: false
        type: string
  # push:
  # workflow_dispatch:
permissions:
  id-token: write
  contents: write

jobs:
  variable-parser:
    runs-on: ubuntu-latest
    outputs:
      variable: ${{ steps.var.outputs.var}}    
    permissions:
      id-token: write
      contents: write
    steps:
      - name: set env
        id: var
        run: echo variable=test >> $GITHUB_OUTPUT 
      - name: Variable Parser
        run: echo "${{ steps.var.outputs.variable }}"